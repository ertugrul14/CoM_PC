name: Fetch Pedestrian Data

on:
  schedule:
    # Runs every hour at minute 0 (e.g., 1:00, 2:00, 3:00...)
    # Provides 24 hourly snapshots per day for temporal analysis
    # Aligns with parking data collection schedule
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  fetch-pedestrian:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
      
      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      
      - name: 🚶 Fetch pedestrian data
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python scripts/fetch_pedestrian_data.py
      
      - name: ✅ Summary
        run: |
          echo "✅ Pedestrian data fetch completed!"
          echo "⏰ Timestamp: $(date)"