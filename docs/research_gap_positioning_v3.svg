<svg width="100%" viewBox="0 0 680 580" xmlns="http://www.w3.org/2000/svg" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #1a1d21;">
<style>
  text { fill: #e0e4e8; }
  .th { font-size: 14px; font-weight: 500; }
  .ts { font-size: 12px; fill: #9ca3af; }
</style>

<text class="th" x="340" y="24" text-anchor="middle">Research positioning: where the gap is</text>

<!-- Axes -->
<line x1="170" y1="60" x2="170" y2="470" stroke="#636e72" stroke-width="0.5"/>
<line x1="170" y1="470" x2="640" y2="470" stroke="#636e72" stroke-width="0.5"/>

<!-- X-axis label -->
<text class="ts" x="405" y="498" text-anchor="middle">Prediction capability</text>
<text class="ts" x="405" y="514" text-anchor="middle">(static classification → network impact prediction)</text>

<!-- Y-axis label -->

<!-- X-axis ticks -->
<text class="ts" x="260" y="488">Classification</text>
<text class="ts" x="405" y="488">Forecasting</text>
<text class="ts" x="570" y="488">Intervention</text>

<!-- Y-axis ticks -->
<text class="ts" x="165" y="434" text-anchor="end">Pedestrian only</text>
<text class="ts" x="165" y="352" text-anchor="end">Parking only</text>
<text class="ts" x="165" y="270" text-anchor="end">Parking + bike</text>
<text class="ts" x="165" y="188" text-anchor="end">Parking + ped</text>
<text class="ts" x="165" y="106" text-anchor="end">Joint + network</text>

<!-- Gridlines -->
<line x1="170" y1="434" x2="640" y2="434" stroke="#4b5563" stroke-width="0.3" stroke-dasharray="3 3"/>
<line x1="170" y1="352" x2="640" y2="352" stroke="#4b5563" stroke-width="0.3" stroke-dasharray="3 3"/>
<line x1="170" y1="270" x2="640" y2="270" stroke="#4b5563" stroke-width="0.3" stroke-dasharray="3 3"/>
<line x1="170" y1="188" x2="640" y2="188" stroke="#4b5563" stroke-width="0.3" stroke-dasharray="3 3"/>
<line x1="170" y1="106" x2="640" y2="106" stroke="#4b5563" stroke-width="0.3" stroke-dasharray="3 3"/>
<line x1="330" y1="60" x2="330" y2="470" stroke="#4b5563" stroke-width="0.3" stroke-dasharray="3 3"/>
<line x1="490" y1="60" x2="490" y2="470" stroke="#4b5563" stroke-width="0.3" stroke-dasharray="3 3"/>

<!-- GAP 3 highlight: empty Parking + ped row -->
<rect x="172" y="162" width="466" height="52" rx="4" fill="#E24B4A" fill-opacity="0.06" stroke="#E24B4A" stroke-width="0.8" stroke-dasharray="6 3"/>
<text x="406" y="194" text-anchor="middle" fill="#E24B4A" font-size="12px" opacity="0.7">Gap 3 — no work here</text>

<!-- Pedestrian only row — both forecasting -->
<circle cx="380" cy="430" r="22" fill="#2d1f3d" stroke="#7c3aed" stroke-width="0.5"/>
<text x="380" y="426" text-anchor="middle" fill="#a78bfa" font-size="12px">Sevtsuk</text>
<text x="380" y="440" text-anchor="middle" fill="#a78bfa" font-size="12px">2021</text>

<circle cx="440" cy="430" r="22" fill="#282c30" stroke="#4b5563" stroke-width="0.5"/>
<text x="440" y="426" text-anchor="middle" fill="#9ca3af" font-size="12px">Asher</text>
<text x="440" y="440" text-anchor="middle" fill="#9ca3af" font-size="12px">2025</text>

<!-- Parking only row — both forecasting -->
<circle cx="380" cy="348" r="18" fill="#282c30" stroke="#4b5563" stroke-width="0.5"/>
<text x="380" y="352" text-anchor="middle" fill="#9ca3af" font-size="12px">AGCRU</text>

<circle cx="440" cy="348" r="18" fill="#282c30" stroke="#4b5563" stroke-width="0.5"/>
<text x="440" y="352" text-anchor="middle" fill="#9ca3af" font-size="12px">CPPM</text>

<!-- Parking + bike row — both classification -->
<circle cx="240" cy="266" r="22" fill="#1a332e" stroke="#14b8a6" stroke-width="0.5"/>
<text x="240" y="262" text-anchor="middle" fill="#5eead4" font-size="12px">Su et al.</text>
<text x="240" y="276" text-anchor="middle" fill="#5eead4" font-size="12px">2022</text>

<circle cx="300" cy="266" r="24" fill="#1e3a5f" stroke="#3b82f6" stroke-width="0.5"/>
<text x="300" y="262" text-anchor="middle" fill="#93c5fd" font-size="12px">Hao et al.</text>
<text x="300" y="276" text-anchor="middle" fill="#93c5fd" font-size="12px">2023</text>

<!-- YOUR WORK — top right -->
<rect x="510" y="78" width="120" height="56" rx="10" fill="#3d1f1a" stroke="#ef4444" stroke-width="1.5"/>
<text x="570" y="100" text-anchor="middle" dominant-baseline="central" fill="#f87171" font-size="14px" font-weight="500">This thesis</text>
<text x="570" y="120" text-anchor="middle" dominant-baseline="central" fill="#fca5a5" font-size="12px">The gap</text>

<!-- Arrow from gap row to thesis -->
<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<line x1="500" y1="188" x2="520" y2="132" stroke="#ef4444" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arr)"/>

<!-- Bottom text -->
<text class="ts" x="340" y="546" text-anchor="middle">No existing work jointly models parking + pedestrian for curbside reallocation (Gap 3).</text>
<text class="ts" x="340" y="562" text-anchor="middle">This thesis fills the top-right: joint modelling with network-wide intervention prediction.</text>
</svg>
